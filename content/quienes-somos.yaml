historia: >-
  Gabriel Lombardo fundó Vecinos en Alerta de Lomas del Mirador hace más de 30
  años, en el partido de La Matanza. En 2008, VaLoMi figura como asociación, con reuniones semanales con vecinos
  víctimas de la violencia delictiva.
queHacemos:
  - Me reúno con vecinos que sufren la violencia delictiva y llevo sus reclamos a las autoridades.
  - Sigo la respuesta de las autoridades y estudio cómo funciona la seguridad en el territorio, desde el patrullaje y los móviles hasta la distribución de recursos y de fondos.
  - Camino la calle. No soy político y no cobro subsidios.
  - Publico el Informe VaLoMi, con el documento original para descargar.
lema: La seguridad no tiene color político.
