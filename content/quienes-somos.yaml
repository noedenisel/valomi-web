bio: >-
  Soy Gabriel Lombardo, vecino de Lomas del Mirador, en La Matanza. Soy
  distribuidor de pan desde toda la vida. Hace más de 30 años fundé Vecinos en
  Alerta de Lomas del Mirador, por algo que no hace el Estado a nivel municipal, provincial y
  nacional. Sé lo que es la inseguridad: ya sufrí {asaltos} asaltos, y la cifra
  sigue creciendo. Hoy estoy solo, porque mi familia se fue. Desde ahí me reúno con vecinos que sufren la violencia
  delictiva y llevo sus reclamos a las autoridades. No soy político, no cobro
  subsidios: camino la calle. Es un trabajo que nadie me paga. Porque el Estado está
  donde no debe y falta donde debe estar. Y la seguridad no tiene color
  político.
