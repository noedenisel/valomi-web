descripcion: |-
  Presentación: 4 de noviembre de 2026, a las 13:45, por correo. Marco: Ley 12.475 y Decreto 2549/04.

  Objeto: 6 puntos sobre fondos municipales de seguridad de 2016, Decreto 371/2025, distribución 2025, transferencias provinciales desde 2020, fondos nacionales 2020–2021 y rendiciones. Este es un resumen del objeto; el texto literal completo está pendiente de incorporación en una versión pública.

  Qué información pedimos (resumen por temas, no transcripción literal):

  - Cuánto se asignó y cuánto se transfirió a La Matanza por el fondo de seguridad de 2016 y por el Decreto 371/2025, con la fecha de cada cuota.
  - Otras transferencias provinciales para seguridad desde 2020.
  - Los fondos nacionales que la Provincia giró al Municipio en 2020 y 2021.
  - Las rendiciones que presentó el Municipio.

  Actuación: requerimiento de requisitos formales. Fecha: 10 de noviembre de 2026. Resultado: el organismo pidió completar requisitos formales; no entregó la documentación solicitada. Documento respaldatorio: correo del 10/11/2026 informado por VaLoMi; versión pública pendiente.

  Actuación: envío de la nota firmada de subsanación. Fecha informada: 16 de noviembre de 2026, a confirmar con la constancia. Resultado: Subsanación presentada. Faltan la constancia de recepción, el número de expediente y la entrega de la documentación. Documento respaldatorio: nota de subsanación informada; versión pública y constancia pendientes.

  Plazo: pendiente de verificación. No se señala incumplimiento sin verificar el vencimiento legal y la fecha de recepción válida.

  Fuente: registro de seguimiento informado por VaLoMi, con corte al 19 de noviembre de 2026. No se adjuntan notas firmadas ni documentos con datos personales.
