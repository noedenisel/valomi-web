titulo: Pedido al Ministerio de Economía de la Provincia de Buenos Aires
tipo: pedido
fecha: 2026-11-04
organismo: Ministerio de Economía de la Provincia de Buenos Aires
situacion: en-espera
descripcion: |-
  Enviado el 4 de noviembre de 2026, entre las 13:42 y las 13:45, a infopublica@mgob.gba.gob.ar (Dirección de Acceso a la Información Pública de la Provincia).

  Pedimos copia digital de:

  - Cuánto se asignó y cuánto se transfirió a La Matanza por el fondo de seguridad de 2016 y por el Decreto 371/2025, con la fecha de cada cuota.
  - Otras transferencias provinciales para seguridad desde 2020.
  - Los fondos nacionales que la Provincia giró al Municipio en 2020 y 2021.
  - Las rendiciones que presentó el Municipio.

  Plazo: el mismo que para el Ministerio de Seguridad (primer plazo hacia el 16/11/2026; denegado si no hay respuesta a los 30 días hábiles, hacia el 21/12/2026).
publicado: true
