titulo: Pedido al Ministerio de Seguridad de la Nación
tipo: pedido
fecha: 2026-11-04
fechaActualizacion: 2026-11-19
puntos: 5
organismo: Ministerio de Seguridad de la Nación
situacion: tramite-registrado
descripcion: |-
  Presentación por correo: 4 de noviembre de 2026, a las 14:01. Marco: Ley 27.275.

  Objeto: 5 puntos sobre el Programa Nacional de Fortalecimiento de Seguridad 2020–2021, transferencias, despliegues de fuerzas federales, aportes nacionales desde 2024 y estadísticas SNIC. Este es un resumen del objeto; el texto literal completo está pendiente de incorporación en una versión pública.

  Qué información pedimos (resumen por temas, no transcripción literal):

  - El acto que puso en marcha el Programa Nacional de Fortalecimiento de Seguridad de 2020 y 2021, y lo que se transfirió a la Provincia o a La Matanza.
  - Cuántos efectivos federales hubo en el partido entre 2020 y 2026.
  - Las transferencias nacionales para seguridad a la Provincia y a municipios bonaerenses desde 2024.
  - Los homicidios y delitos denunciados en La Matanza entre 2023 y 2026 según el Sistema Nacional de Información Criminal, con la población usada para calcular la tasa.

  Actuación: orientación sobre el canal de presentación. Fecha: 4 de noviembre de 2026, a las 21:04. Resultado: Alejandro Salesi, de la Dirección Nacional de Transparencia e Integridad, recomendó presentar el pedido por TAD. Esa nota indica un canal; no entrega la información pedida. Documento respaldatorio: correo de orientación informado por VaLoMi; versión pública pendiente.

  Actuación: carga del pedido en TAD informada por VaLoMi. Fecha de la comunicación: 19 de noviembre de 2026. Resultado: Trámite registrado, según lo informado por la organización. El 19 de noviembre no se presenta como una fecha exacta de carga verificada: faltan esa fecha, la constancia y el número de expediente. También está pendiente la respuesta sobre el contenido. Documento respaldatorio: constancia de TAD pendiente de incorporación.

  Plazo: pendiente de verificación. No se señala incumplimiento sin verificar el vencimiento legal y la fecha de recepción válida.

  Fuente: registro de seguimiento informado por VaLoMi, con corte al 19 de noviembre de 2026. No se adjuntan documentos con datos personales.
