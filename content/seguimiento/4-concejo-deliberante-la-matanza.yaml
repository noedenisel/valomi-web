titulo: Pedido al Honorable Concejo Deliberante de La Matanza
tipo: pedido
fecha: 2026-11-04
organismo: Honorable Concejo Deliberante de La Matanza
situacion: en-espera
descripcion: |-
  Enviado el 4 de noviembre de 2026 a las 13:59 a contacto@hcdlamatanza.gov.ar.

  Pedimos copia digital de:

  - Las ordenanzas fiscal, impositiva y de presupuesto de 2025 y 2026.
  - La rendición de cuentas de 2020 a 2024, en lo que corresponde a seguridad.
  - Los convenios de seguridad con la Provincia y la Nación que el Concejo ratificó, y los pedidos de informe sobre el tema.
  - Si el Municipio tiene una ordenanza de acceso a la información pública.

  Plazo: igual que el Municipio. Pedimos respuesta en 15 días hábiles (hacia el 26/11/2026).
