descripcion: |-
  Presentación: 4 de noviembre de 2026, a las 13:59.

  Objeto: 6 puntos sobre ordenanzas fiscales e impositivas, presupuestos, rendiciones, convenios de seguridad, pedidos de informes y una eventual ordenanza municipal de acceso a la información. Este es un resumen del objeto; el texto literal completo está pendiente de incorporación en una versión pública.

  Qué información pedimos (resumen por temas, no transcripción literal):

  - Las ordenanzas fiscal, impositiva y de presupuesto de 2025 y 2026.
  - La rendición de cuentas de 2020 a 2024, en lo que corresponde a seguridad.
  - Los convenios de seguridad con la Provincia y la Nación que el Concejo ratificó, y los pedidos de informe sobre el tema.
  - Si el Municipio tiene una ordenanza de acceso a la información pública.

  Actuación: presentación de la solicitud y acuse automático por vía electrónica. Fecha: 4 de noviembre de 2026. Resultado: Recepción confirmada mediante un acuse automático. No es una constancia de ingreso administrativo formal ni una respuesta sobre el contenido. Documento respaldatorio: acuse automático informado por VaLoMi; versión pública pendiente.

  Plazo: pendiente de verificación. No se señala incumplimiento sin verificar el vencimiento legal y la fecha de recepción válida.

  Fuente: registro de seguimiento informado por VaLoMi, con corte al 19 de noviembre de 2026. No se adjuntan documentos con datos personales.
