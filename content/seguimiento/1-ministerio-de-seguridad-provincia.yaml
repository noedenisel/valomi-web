titulo: Pedido al Ministerio de Seguridad de la Provincia de Buenos Aires
tipo: pedido
fecha: 2026-11-04
fechaActualizacion: 2026-11-16
puntos: 14
organismo: Ministerio de Seguridad de la Provincia de Buenos Aires
situacion: subsanacion-presentada
descripcion: |-
  Presentación: 4 de noviembre de 2026, a las 13:42, por correo. Marco: Ley 12.475 y Decreto 2549/04.

  Objeto: 14 puntos sobre normas de emergencia en seguridad, contrataciones, Comandos de Patrullas y cuadrículas, recorridas, móviles y efectivos, gastos, fondos y denuncias 2023–2026. Este es un resumen del objeto; el texto literal completo está pendiente de incorporación en una versión pública.

  Qué información pedimos (resumen por temas, no transcripción literal):

  - Las normas de emergencia en seguridad dictadas desde 2004, con fecha de inicio y de fin, y cualquiera posterior al 31/03/2025.
  - Las contrataciones hechas con la emergencia de la Ley 14.806 entre el 01/01/2025 y el 31/03/2025.
  - Cómo están organizados los Comandos de Patrullas de La Matanza, con la frecuencia de recorridas y su cumplimiento en 2025 y 2026.
  - Los móviles asignados al partido por mes desde 2021, cuántos estuvieron en servicio y cuánto se gastó en combustible y mantenimiento.
  - Lo que recibió La Matanza del Fondo de Fortalecimiento de la Seguridad (Decreto 371/2025) y las rendiciones del Municipio.
  - Las denuncias por delito en las comisarías del partido entre 2023 y 2026.

  Actuación: requerimiento de requisitos formales. Fecha: 5 de noviembre de 2026. Resultado: el área provincial pidió cumplir requisitos formales; no entregó la información solicitada. Documento respaldatorio: requerimiento informado por VaLoMi; versión pública pendiente.

  Actuación: envío de la nota firmada de subsanación. Fecha informada: 16 de noviembre de 2026, a confirmar con la constancia. Resultado: Subsanación presentada. Faltan la constancia de recepción, el número de expediente y la respuesta sobre el contenido. Documento respaldatorio: nota de subsanación informada; versión pública y constancia pendientes.

  Plazo: pendiente de verificación. No se señala incumplimiento sin verificar el vencimiento legal y la fecha de recepción válida.

  Fuente: registro de seguimiento informado por VaLoMi, con corte al 19 de noviembre de 2026. No se adjuntan notas firmadas ni documentos con datos personales.
