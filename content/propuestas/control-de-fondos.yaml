titulo: Control del uso de fondos públicos
orden: 5
icono: documento
resumen: Que se informe de manera transparente cuánto se destina a seguridad, en qué se usa y con qué resultado, mediante el acceso a la información pública.
puntos:
  - Pedir que la distribución de recursos responda a dónde y cuándo ocurren los hechos.
