titulo: Cámaras de seguridad
orden: 1
icono: camara
resumen: Solicito la instalación de cámaras donde sé que pasan los hechos, funcionando y conectadas con quien tiene que responder.
puntos:
  - Relevar con los vecinos los puntos que necesitan cobertura.
  - Que se informe cuántas cámaras hay, dónde están, cuántas funcionan y quién las monitorea.
  - Seguir cada pedido de instalación o reparación hasta su respuesta.
