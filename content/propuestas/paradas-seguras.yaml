titulo: Paradas seguras
orden: 3
icono: parada
resumen: Que esperar el colectivo no sea un riesgo, sobre todo de madrugada y de noche.
puntos:
  - Identificar las paradas que más preocupan a los vecinos.
  - Iluminación, visibilidad y presencia preventiva en los horarios de más movimiento.
  - Que se respete la ley que obliga a los colectivos a frenar en todas las esquinas después de las 22 h.
